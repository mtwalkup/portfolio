name: dag-tests

# Reusable: invoked by the ci-gate workflow, not triggered directly, so the
# repo exposes a single org-standard "ci-gate" check rather than several.
on:
  workflow_call:

jobs:
  dag-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the pinned Airflow with its official constraints file so the
      # transitive dependency set matches what the version was released against.
      - name: Install Airflow
        run: |
          pip install "apache-airflow==3.2.2" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-3.12.txt"
      # Parse-only DAG validation. include_examples=False keeps it to our DAGs.
      - name: Run DAG tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest healthcare/airflow/tests -q
