name: pre-commit

# Reusable: invoked by the ci-gate workflow, not triggered directly, so the
# repo exposes a single org-standard "ci-gate" check rather than several.
on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
