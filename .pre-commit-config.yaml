# Pre-commit hooks. Install once with `pre-commit install`; run on demand with
# `pre-commit run --all-files`. Versions are pinned so every checkout lints with
# the same tool versions regardless of what's in the local venv.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Lints the GitHub Actions workflow files themselves (catches the kind of
  # mistakes plain YAML parsing can't, e.g. bad `needs`/`if` expressions).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
